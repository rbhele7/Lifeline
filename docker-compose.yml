version: '3.8'

services:
  db:
    image: postgres:15-alpine
    container_name: lifeline_db
    environment:
      POSTGRES_USER: lifeline
      POSTGRES_PASSWORD: lifeline
      POSTGRES_DB: lifeline_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U lifeline -d lifeline_db"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: lifeline_backend
    environment:
      DATABASE_URL: postgresql://lifeline:lifeline@db:5432/lifeline_db
      JWT_SECRET_KEY: ${JWT_SECRET_KEY:-dev-secret-key-change-in-production-min-32-chars-long}
      JWT_ALGORITHM: HS256
      ACCESS_TOKEN_EXPIRE_MINUTES: 30
      OSRM_BASE_URL: https://router.project-osrm.org
      FRONTEND_URL: http://localhost:5173
      BACKEND_URL: http://localhost:8000
      DEMO_MODE: "true"
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: lifeline_frontend
    ports:
      - "5173:80"
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  postgres_data:
    driver: local
